name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          path="${RUNNER_TEMP}/${archive}"
          gh release download "lychee-v${LYCHEE_VERSION}" --repo lycheeverse/lychee --pattern "${archive}" --dir "${RUNNER_TEMP}"
          printf '%s  %s\n' "${LYCHEE_SHA256}" "${path}" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/lychee"
          tar --extract --gzip --file "${path}" --directory "${RUNNER_TEMP}/lychee" --strip-components 1
      - name: Check documentation links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/lychee/lychee" --config lychee.toml --hidden '**/*.md'

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install expect
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
      - run: cargo test --workspace --locked

  quota-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install quota support
        run: |
          sudo apt-get update
          sudo apt-get install -y quota "linux-modules-extra-$(uname -r)"
          sudo modprobe quota_v2
      - name: Create quota-enabled ext4 fixture
        run: |
          image="${RUNNER_TEMP}/degu-quota.img"
          mount_point="${RUNNER_TEMP}/degu-quota"
          echo "DEGU_QUOTA_TEST_PATH=${mount_point}" >> "${GITHUB_ENV}"
          truncate --size 128M "${image}"
          mkfs.ext4 -q -O quota -E quotatype=usrquota "${image}"
          mkdir "${mount_point}"
          sudo mount -o loop,usrquota "${image}" "${mount_point}"
          sudo chown "$(id -u):$(id -g)" "${mount_point}"
          sudo setquota -u "$(id -u)" 2048 4096 20 40 "${mount_point}"
          dd if=/dev/zero of="${mount_point}/allocated.bin" bs=1024 count=128 status=none
          mkdir "${mount_point}/one" "${mount_point}/two"
      - name: Test authoritative ext4 quota
        run: timeout 60s cargo test --locked -p degu --test quota quota_linux_ext4_fixture_reports_configured_limits -- --ignored --exact
      - name: Unmount quota fixture
        if: always()
        run: |
          if mountpoint -q "${DEGU_QUOTA_TEST_PATH}"; then
            sudo umount "${DEGU_QUOTA_TEST_PATH}"
          fi

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: ./tools/test-installer.sh
