name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain selected by the calling workflow
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: ${{ inputs.toolchain || 'stable' }}

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # rolling-ref: v1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Intra-doc links are invisible to clippy, and the `docs` job's link check
      # reads markdown only, so a link to a deleted or private item ships
      # silently. This is the step that sees it.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          path="${RUNNER_TEMP}/${archive}"
          gh release download "lychee-v${LYCHEE_VERSION}" --repo lycheeverse/lychee --pattern "${archive}" --dir "${RUNNER_TEMP}"
          printf '%s  %s\n' "${LYCHEE_SHA256}" "${path}" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/lychee"
          tar --extract --gzip --file "${path}" --directory "${RUNNER_TEMP}/lychee" --strip-components 1
      - name: Check documentation links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/lychee/lychee" --config lychee.toml --hidden '**/*.md'

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # rolling-ref: v1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install expect
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
      # The tests that stage a tree need their temporary directory on a backend
      # degu certifies, and on Linux they skip rather than fail when it is not.
      # Ubuntu 26.04 may mount /tmp as tmpfs; /var/tmp stays on the runner's disk,
      # root-owned and sticky as /tmp is on 24.04. The check fails the job where
      # the tests would otherwise skip.
      - name: Test the workspace
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            umask 002
            TMPDIR=$(mktemp -d /var/tmp/degu-test.XXXXXX)
            export TMPDIR
            fstype=$(findmnt -n -o FSTYPE -T "${TMPDIR}")
            case "${fstype}" in
              ext4 | xfs) ;;
              *)
                echo "::error::${TMPDIR} is on ${fstype}, which degu does not certify"
                exit 1
                ;;
            esac
          fi
          cargo test --workspace --locked

  quota-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # rolling-ref: v1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install quota support
        run: |
          sudo apt-get update
          sudo apt-get install -y quota
          # Older Azure kernels keep quota_v2 in a separate extra-modules package;
          # 7.0 ships it with the kernel's own modules and has no such package.
          if ! modinfo quota_v2 >/dev/null 2>&1; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe quota_v2
      - name: Create quota-enabled ext4 fixture
        run: |
          image="${RUNNER_TEMP}/degu-quota.img"
          mount_point="${RUNNER_TEMP}/degu-quota"
          echo "DEGU_QUOTA_TEST_PATH=${mount_point}" >> "${GITHUB_ENV}"
          truncate --size 128M "${image}"
          mkfs.ext4 -q -O quota -E quotatype=usrquota "${image}"
          mkdir "${mount_point}"
          sudo mount -o loop,usrquota "${image}" "${mount_point}"
          sudo chown "$(id -u):$(id -g)" "${mount_point}"
          sudo setquota -u "$(id -u)" 2048 4096 20 40 "${mount_point}"
          dd if=/dev/zero of="${mount_point}/allocated.bin" bs=1024 count=128 status=none
          mkdir "${mount_point}/one" "${mount_point}/two"
      # Built before it is timed. The budget is there to stop a quota syscall
      # hanging the job, and this runner has no cargo cache, so leaving the
      # build inside it spends the budget on compiling the dependency graph
      # instead: the run that failed reached degu itself with nine seconds left.
      - name: Build the quota test
        run: cargo build --locked -p degu --test quota
      - name: Test authoritative ext4 quota
        run: timeout 60s cargo test --locked -p degu --test quota quota_linux_ext4_fixture_reports_configured_limits -- --ignored --exact
      - name: Unmount quota fixture
        if: always()
        run: |
          if mountpoint -q "${DEGU_QUOTA_TEST_PATH}"; then
            sudo umount "${DEGU_QUOTA_TEST_PATH}"
          fi

  # Static musl binaries are the core deliverable: no-root HPC login nodes on aging glibc.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # rolling-ref: v1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --workspace --release --locked --target x86_64-unknown-linux-musl
      - name: verify the artifact is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/degu | grep -qE "statically linked|static-pie linked"
      - name: test the release contracts
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '[.packages[] | select(.name == "degu") | .version] | if length == 1 then .[0] else error("expected one degu package") end')
          ./tools/verify-release-contract.sh
          ./tools/test-release-assets.sh "v${version}" x86_64-unknown-linux-musl
          ./tools/test-release-records.sh
          grep -Fq "DEGU_VERSION=\"\$version\" sh \"\$installer\"" docs/installation.md || { echo "Installation guide must pin DEGU_VERSION to the downloaded tag" >&2; exit 1; }
      - name: verify the crates package for publication
        run: cargo publish --workspace --dry-run --locked

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: ./tools/test-installer.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  workflow-security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          path="${RUNNER_TEMP}/${archive}"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --pattern "${archive}" --dir "${RUNNER_TEMP}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${path}" | sha256sum --check --strict -
          gh attestation verify "${path}" --repo rhysd/actionlint
          tar --extract --gzip --file "${path}" --directory "${RUNNER_TEMP}" actionlint
      - name: Lint workflows
        run: |
          "${RUNNER_TEMP}/actionlint"
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          annotations: true
          min-confidence: high
          online-audits: true
          persona: regular
          version: 1.27.0
