[workspace]
resolver = "3"
members = [
    "crates/degu-walk",
    "crates/degu-core",
    "crates/degu-adapters",
    "crates/degu",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FeathBow/degu"

[workspace.dependencies]
degu-core = { path = "crates/degu-core", version = "0.1.3" }
degu-walk = { path = "crates/degu-walk", version = "0.1.3" }
degu-adapters = { path = "crates/degu-adapters", version = "0.1.3" }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.2"
comfy-table = "7.2"
crossterm = { version = "0.29", default-features = false }
terminal_size = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
jiff = "0.2"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
getrandom = "0.4"
rustix = { version = "1.1", features = ["fs", "process"] }
libc = "0.2"
tempfile = "3.27"
assert_cmd = "2.2"
unicode-width = "0.2"

[profile.dev]
incremental = false

# Favor small static release binaries.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
