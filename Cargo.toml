[workspace]
resolver = "3"
members = [
    "crates/degu-walk",
    "crates/degu-core",
    "crates/degu-adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
degu-core = { path = "crates/degu-core", version = "0.1.0" }
degu-walk = { path = "crates/degu-walk", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
rustix = { version = "1.1", features = ["fs", "process"] }
libc = "0.2"
tempfile = "3.27"

[profile.dev]
incremental = false

# Favor small static release binaries.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
