[package]
name = "degu"
description = "Find and safely reclaim user-owned caches and build artifacts when HOME quota is tight"
readme = "../../README.md"
keywords = ["cache", "cleanup", "disk-space", "hpc", "quota"]
categories = ["command-line-utilities", "filesystem"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "degu"

[[bin]]
name = "degu"
path = "src/main.rs"
test = false

[[bin]]
name = "dg"
path = "src/bin/dg.rs"
test = false

[dependencies]
degu-core.workspace = true
degu-walk.workspace = true
degu-adapters.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
terminal_size.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
rustix.workspace = true
libc.workspace = true
unicode-width.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/degu-v{ version }-{ target }.tar.gz"
bin-dir = "degu-v{ version }-{ target }/{ bin }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]
