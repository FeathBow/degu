[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive set compatible with MIT OR Apache-2.0; additions require review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
# Scoped to the one crate that needs it rather than admitted globally. Zlib is
# permissive and, unlike MIT, binds only source distributions — a published
# binary carries no notice obligation from it. foldhash arrives as hashbrown's
# default hasher beneath ratatui-core, where neither it nor kasuari is optional.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
